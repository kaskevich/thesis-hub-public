<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper I file browser</title>
<meta name="description" content="Every file of the Paper I data release, viewable in the browser before download: tables, documents, code, rasters and vector layers.">
<link rel="stylesheet" href="assets/p1.css">
<link rel="stylesheet" href="lib/hljs-light.css" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
<link rel="stylesheet" href="lib/hljs-dark.css" media="(prefers-color-scheme: dark)">
<style>
.layout{display:flex;height:calc(100vh - 52px);height:calc(100dvh - 52px)}
#side{width:330px;flex:0 0 330px;display:flex;flex-direction:column;border-right:1px solid var(--rule);background:var(--surface)}
#side .search{margin:12px 14px 6px;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
#side .count{padding:0 16px 8px;font-size:12px;color:var(--ink-3)}
#tree{overflow-y:auto;flex:1;padding:0 6px 20px}
.dir{margin:2px 0}
.dir>button{display:flex;width:100%;align-items:center;gap:6px;padding:5px 8px;border:none;background:none;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink);border-radius:5px;text-align:left}
.dir>button:hover{background:var(--surface-2)}
.dir>button .car{display:inline-block;width:10px;color:var(--ink-3);transition:transform .15s}
.dir.closed>button .car{transform:rotate(-90deg)}
.dir.closed>.kids{display:none}
.kids{padding-left:12px}
.file{display:flex;justify-content:space-between;gap:8px;padding:4px 8px 4px 24px;border-radius:5px;text-decoration:none;color:var(--ink-2);font-size:13px}
.file:hover{background:var(--surface-2);color:var(--ink)}
.file.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.file span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file span:last-child{color:var(--ink-3);font-size:11.5px;white-space:nowrap;font-weight:400}
#view{flex:1;min-width:0;overflow-y:auto}
.vhead{padding:18px 24px 14px;border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:2}
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:4px;word-break:break-all}
.crumb a{color:var(--ink-3);text-decoration:none}.crumb a:hover{color:var(--accent)}
.vhead h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 4px;word-break:break-all}
.vhead .desc{color:var(--ink-2);margin:0 0 10px;font-size:14px}
.vhead .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
.vhead .meta code{font-family:var(--mono);font-size:11.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.vbody{padding:20px 24px 48px}
.vbody h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px;font-weight:600}
.vbody h3:first-child{margin-top:0}
.ql{display:block;max-width:100%;border:1px solid var(--rule);border-radius:8px;background:#fff}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;color:var(--ink-3)}
.tools input{flex:1 1 200px;min-width:0;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
.tools button{padding:5px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);cursor:pointer}
.tools button:disabled{opacity:.4;cursor:default}
table.data th.sortable{cursor:pointer}
table.data th.sortable:hover{color:var(--accent)}
table.data td{max-width:440px}
table.data td.nw{white-space:nowrap}
table.data td.wrap{min-width:260px}
.tablewrap.tall{max-height:70vh}
.md{max-width:820px;line-height:1.65;font-size:15px}
.md h1,.md h2{font-family:var(--serif);font-weight:600}
.md h1{font-size:26px;margin:0 0 12px}.md h2{font-size:20px;margin:28px 0 10px}.md h3{font-size:16px;margin:20px 0 8px;text-transform:none;letter-spacing:0;color:var(--ink)}
.md table{border-collapse:collapse;margin:12px 0;font-size:13.5px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2)}
.md code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.md pre{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;overflow-x:auto}
.md pre code{background:none;padding:0}
pre.code{margin:0;font:12.5px/1.55 var(--mono);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;overflow:auto;max-height:78vh;counter-reset:ln}
pre.code code.hljs{background:transparent;padding:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 18px;font-size:13.5px;max-width:860px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;word-break:break-word}
.layer{border:1px solid var(--rule);border-radius:10px;padding:16px;margin:0 0 18px;background:var(--surface)}
.layer h4{font-size:16px;margin:0 0 4px}
.dirlist a{font-weight:600;text-decoration:none}
#menu{display:none}
@media (max-width:760px){
  .layout{display:block;height:auto}
  #side{width:auto;border-right:none;border-bottom:1px solid var(--rule)}
  #side.collapsed #tree,#side.collapsed .count{display:none}
  #tree{max-height:50vh}
  #menu{display:inline-flex;margin:10px 14px 0}
  #view{overflow:visible}
  .vhead{position:static;padding:16px}
  .vbody{padding:16px 16px 40px}
}
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="./">← <span>Data release</span></a>
  <h1>File browser</h1>
  <nav><a href="map.html">Map</a><a class="on" href="browse.html">Files</a><a href="./#files">Download</a></nav>
</header>
<div class="layout">
  <aside id="side" class="collapsed" aria-label="Files">
    <button id="menu" class="btn" type="button">Show all files</button>
    <input class="search" id="q" type="search" placeholder="Filter files" aria-label="Filter files">
    <div class="count" id="count"></div>
    <div id="tree"></div>
  </aside>
  <main id="view"><div class="vbody muted">Loading…</div></main>
</div>
<script src="lib/papaparse.min.js"></script>
<script src="lib/marked.min.js"></script>
<script src="lib/highlight.min.js"></script>
<script>
(function () {
  'use strict';
  var M = null, byPath = {}, view = document.getElementById('view');
  var ORDER = ['README.md', 'LICENSE.md', 'CITATION.cff', 'CHANGELOG.md', 'SHA256SUMS.txt', '.zenodo.json', 'data', 'tables', 'results', 'docs', 'code'];
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
  function size(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' kB'; }
  function fileUrl(p) { return 'files/' + p.split('/').map(encodeURIComponent).join('/'); }
  function rank(name) { var i = ORDER.indexOf(name); return i < 0 ? 99 : i; }

  /* ---------------- tree */
  function buildTree() {
    var root = {dirs: {}, files: []};
    M.files.forEach(function (f) {
      var parts = f.path.split('/'), node = root;
      for (var i = 0; i < parts.length - 1; i++) node = node.dirs[parts[i]] = node.dirs[parts[i]] || {dirs: {}, files: [], path: parts.slice(0, i + 1).join('/')};
      node.files.push(f);
    });
    function render(node, depth) {
      var h = '';
      node.files.slice().sort(function (a, b) { return rank(a.path) - rank(b.path) || a.path.localeCompare(b.path); }).forEach(function (f) {
        h += '<a class="file" href="#f=' + encodeURIComponent(f.path) + '" data-p="' + esc(f.path) + '"><span>' + esc(f.path.split('/').pop()) + '</span><span>' + size(f.bytes) + '</span></a>';
      });
      Object.keys(node.dirs).sort(function (a, b) { return rank(a) - rank(b) || a.localeCompare(b); }).forEach(function (d) {
        var c = node.dirs[d];
        h += '<div class="dir' + (depth >= 1 ? ' closed' : '') + '" data-d="' + esc(c.path) + '"><button type="button"><span class="car">▾</span>' + esc(d) + '/</button><div class="kids">' + render(c, depth + 1) + '</div></div>';
      });
      return h;
    }
    document.getElementById('tree').innerHTML = render(root, 0);
    document.getElementById('count').textContent = M.files.length + ' files · ' + size(M.files.reduce(function (s, f) { return s + f.bytes; }, 0));
    Array.prototype.forEach.call(document.querySelectorAll('.dir>button'), function (b) {
      b.addEventListener('click', function () { b.parentNode.classList.toggle('closed'); });
    });
  }
  document.getElementById('q').addEventListener('input', function (e) {
    var t = e.target.value.toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll('.file'), function (a) {
      var f = byPath[a.dataset.p];
      a.style.display = !t || (f.path + ' ' + f.desc).toLowerCase().indexOf(t) >= 0 ? '' : 'none';
    });
    Array.prototype.forEach.call(document.querySelectorAll('.dir'), function (d) {
      if (t) d.classList.remove('closed');
      d.style.display = !t || d.querySelector('.file:not([style*="none"])') ? '' : 'none';
    });
  });
  var side = document.getElementById('side');
  document.getElementById('menu').addEventListener('click', function () {
    side.classList.toggle('collapsed');
    this.textContent = side.classList.contains('collapsed') ? 'Show all files' : 'Hide file list';
  });

  /* ---------------- generic table viewer */
  function tableViewer(el, url, opts) {
    opts = opts || {};
    el.innerHTML = '<div class="muted small">Loading table…</div>';
    Papa.parse(url, {download: true, header: false, skipEmptyLines: true, complete: function (res) {
      var data = res.data, head = data.shift() || [], rows = data, view = rows, page = 0, per = opts.per || 100, sortCol = -1, sortDir = 1;
      var numeric = head.map(function (_, j) {
        var seen = 0;
        for (var i = 0; i < rows.length && seen < 200; i++) { var v = rows[i][j]; if (v === '' || v === undefined) continue; seen++; if (isNaN(Number(v))) return false; }
        return seen > 0;
      });
      el.innerHTML = '<div class="tools"><input type="search" placeholder="Search in this table" aria-label="Search in this table"><span class="info"></span>' +
        '<button type="button" data-a="prev">‹ Previous</button><button type="button" data-a="next">Next ›</button></div>' +
        '<div class="tablewrap tall"><table class="data"><thead><tr>' + head.map(function (h, j) { return '<th class="sortable' + (numeric[j] ? ' num' : '') + '" data-j="' + j + '">' + esc(h) + '</th>'; }).join('') +
        '</tr></thead><tbody></tbody></table></div>';
      var tbody = el.querySelector('tbody'), info = el.querySelector('.info'), prev = el.querySelector('[data-a=prev]'), next = el.querySelector('[data-a=next]');
      function draw() {
        var pages = Math.max(1, Math.ceil(view.length / per));
        page = Math.min(page, pages - 1);
        var slice = view.slice(page * per, page * per + per);
        tbody.innerHTML = slice.map(function (r) { return '<tr>' + head.map(function (_, j) {
          var v = r[j] === undefined ? '' : r[j];
          return '<td class="' + (numeric[j] ? 'num' : (String(v).length > 60 ? 'wrap' : 'nw')) + '">' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('');
        info.textContent = view.length.toLocaleString() + ' of ' + rows.length.toLocaleString() + ' rows · ' + head.length + ' columns · page ' + (page + 1) + ' of ' + pages;
        prev.disabled = page === 0; next.disabled = page >= pages - 1;
      }
      el.querySelector('input').addEventListener('input', function (e) {
        var t = e.target.value.toLowerCase();
        view = !t ? rows : rows.filter(function (r) { return r.join('\u0001').toLowerCase().indexOf(t) >= 0; });
        if (sortCol >= 0) sortView();
        page = 0; draw();
      });
      function sortView() {
        var j = sortCol;
        view = view.slice().sort(function (a, b) {
          var x = a[j], y = b[j];
          if (numeric[j]) { x = x === '' ? -Infinity : Number(x); y = y === '' ? -Infinity : Number(y); return (x - y) * sortDir; }
          return String(x).localeCompare(String(y)) * sortDir;
        });
      }
      Array.prototype.forEach.call(el.querySelectorAll('th.sortable'), function (th) {
        th.addEventListener('click', function () {
          var j = +th.dataset.j;
          sortDir = sortCol === j ? -sortDir : 1; sortCol = j; sortView(); page = 0; draw();
          Array.prototype.forEach.call(el.querySelectorAll('th.sortable'), function (t) { t.textContent = head[+t.dataset.j]; });
          th.textContent = head[j] + (sortDir > 0 ? ' ▲' : ' ▼');
        });
      });
      prev.addEventListener('click', function () { page--; draw(); });
      next.addEventListener('click', function () { page++; draw(); });
      draw();
    }, error: function () { el.innerHTML = '<p class="muted">The table could not be loaded.</p>'; }});
  }

  /* ---------------- previews */
  function rewriteLinks(el, base) {
    Array.prototype.forEach.call(el.querySelectorAll('a[href]'), function (a) {
      var h = a.getAttribute('href');
      if (/^(https?:|mailto:|#)/.test(h)) { if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; } return; }
      var parts = (base ? base + '/' + h : h).split('/'), out = [];
      parts.forEach(function (p) { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); });
      var p = out.join('/');
      a.setAttribute('href', '#f=' + encodeURIComponent(p));
    });
  }
  function header(f) {
    var crumbs = f.path.split('/'), acc = [];
    var cr = '<a href="#d=">package</a>' + crumbs.slice(0, -1).map(function (c) { acc.push(c); return ' / <a href="#d=' + encodeURIComponent(acc.join('/')) + '">' + esc(c) + '</a>'; }).join('');
    var map = f.map ? '<a class="btn" href="map.html#show=' + (f.map.indexOf('hex:') === 0 ? 'regions&hex=' + f.map.slice(4) : f.map) + '">Open in map</a>' : '';
    return '<div class="vhead"><div class="crumb">' + cr + '</div><h2>' + esc(crumbs[crumbs.length - 1]) + '</h2>' +
      (f.desc ? '<p class="desc">' + esc(f.desc) + '</p>' : '') +
      '<div class="meta"><span>' + size(f.bytes) + '</span><span>' + esc(f.kind) + '</span>' + (f.sha256 ? '<span title="SHA-256">SHA-256 <code>' + f.sha256.slice(0, 16) + '…</code></span>' : '') + '</div>' +
      '<div class="actions"><a class="btn primary" href="' + fileUrl(f.download || f.path) + '" download>' + (f.download ? 'Download (zip)' : 'Download') + '</a>' +
      (f.download ? '' : '<a class="btn" href="' + fileUrl(f.path) + '" target="_blank" rel="noopener">Open raw file</a>') + map + '</div></div>';
  }
  function showFile(f) {
    Array.prototype.forEach.call(document.querySelectorAll('.file'), function (a) { a.classList.toggle('on', a.dataset.p === f.path); });
    var dir = document.querySelector('.file[data-p="' + CSS.escape(f.path) + '"]');
    for (var n = dir && dir.parentNode; n && n.id !== 'tree'; n = n.parentNode) if (n.classList && n.classList.contains('dir')) n.classList.remove('closed');
    view.innerHTML = header(f) + '<div class="vbody" id="vb"></div>';
    view.scrollTop = 0;
    var vb = document.getElementById('vb'), url = fileUrl(f.path);
    if (f.preview === 'table') tableViewer(vb, url);
    else if (f.preview === 'markdown') fetch(url).then(function (r) { return r.text(); }).then(function (t) {
      vb.innerHTML = '<div class="md">' + marked.parse(t) + '</div>';
      rewriteLinks(vb, f.path.split('/').slice(0, -1).join('/'));
    });
    else if (f.preview === 'code' || f.preview === 'text') fetch(url).then(function (r) { return r.text(); }).then(function (t) {
      var ext = f.path.split('.').pop().toLowerCase();
      var lang = {py: 'python', r: 'r', json: 'json', cff: 'yaml'}[ext];
      var lines = t.split('\n').length;
      vb.innerHTML = '<div class="tools">' + lines.toLocaleString() + ' lines</div><pre class="code"><code></code></pre>';
      var code = vb.querySelector('code');
      if (lang && t.length < 400000) { code.innerHTML = hljs.highlight(t, {language: lang}).value; code.className = 'hljs'; }
      else code.textContent = t;
    });
    else if (f.preview === 'raster') showRaster(vb, f);
    else if (f.preview === 'vector') showVector(vb, f);
    document.title = f.path.split('/').pop() + ' · Paper I file browser';
  }
  function kv(pairs) { return '<dl class="kv">' + pairs.filter(function (p) { return p[1] !== undefined && p[1] !== null && p[1] !== ''; }).map(function (p) { return '<dt>' + esc(p[0]) + '</dt><dd>' + p[1] + '</dd>'; }).join('') + '</dl>'; }
  function showRaster(vb, f) {
    var r = f.raster;
    var h = '<h3>Map preview</h3><img class="ql" src="' + f.quicklooks[0] + '" alt="Map preview of ' + esc(f.path) + '" loading="lazy">' +
      '<p class="small muted">Each cell of this image is 120 m; the file has ' + r.res_m + ' m cells. <a href="map.html#show=' + f.map + '">See it at full resolution on the map</a>.</p>';
    h += '<h3>Raster properties</h3>' + kv([['Coordinate system', esc(r.crs)], ['Size', r.width.toLocaleString() + ' × ' + r.height.toLocaleString() + ' cells'],
      ['Cell size', r.res_m + ' m'], ['Data type', esc(r.dtype)], ['No-data value', r.nodata === null ? 'not set' : esc(r.nodata)],
      ['Extent', esc(r.bounds.join(', '))], ['Format', 'Cloud Optimized GeoTIFF, ' + esc(r.compression) + ', overviews ' + esc(r.overviews.join(', '))],
      ['Band', esc(r.band || '')]].concat(Object.keys(r.tags).map(function (k) { return [k.charAt(0) + k.slice(1).toLowerCase(), esc(r.tags[k])]; })));
    h += '<h3>Cell values</h3><div class="tablewrap"><table class="data"><thead><tr><th>Value</th><th>Meaning</th><th class="num">Cells</th><th class="num">Area (ha)</th></tr></thead><tbody>' +
      r.values.map(function (v) { return '<tr><td class="num">' + v.value + '</td><td>' + esc(v.label) + '</td><td class="num">' + v.cells.toLocaleString() + '</td><td class="num">' + v.area_ha.toLocaleString() + '</td></tr>'; }).join('') + '</tbody></table></div>';
    vb.innerHTML = h;
  }
  function showVector(vb, f) {
    var h = '<p class="small muted">GeoPackage with ' + f.layers.length + ' layer' + (f.layers.length > 1 ? 's' : '') + '. Open it in QGIS, ArcGIS, R (sf) or Python (geopandas).</p>';
    f.layers.forEach(function (l, i) {
      h += '<div class="layer"><h4>Layer <code>' + esc(l.name) + '</code></h4><div class="small muted">' + esc(l.geometry) + ' · ' + l.features.toLocaleString() + ' features · ' + esc(l.crs) + '</div>' +
        '<h3>Map preview</h3><img class="ql" src="' + l.quicklook + '" alt="Map preview of layer ' + esc(l.name) + '" loading="lazy">' +
        '<h3>Fields</h3><div class="tablewrap"><table class="data"><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody>' +
        l.fields.map(function (x) { return '<tr><td><code>' + esc(x.name) + '</code></td><td>' + esc(x.type) + '</td><td>' + esc(x.desc) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        '<h3>Attribute table</h3><div id="attr' + i + '"><button class="btn" type="button" data-i="' + i + '">Show the attribute table (' + l.features.toLocaleString() + ' records)</button></div></div>';
    });
    vb.innerHTML = h;
    Array.prototype.forEach.call(vb.querySelectorAll('button[data-i]'), function (b) {
      b.addEventListener('click', function () { var l = f.layers[+b.dataset.i]; tableViewer(document.getElementById('attr' + b.dataset.i), l.attributes); });
    });
  }
  function showDir(d) {
    var files = M.files.filter(function (f) { return !d || f.path.indexOf(d + '/') === 0; });
    Array.prototype.forEach.call(document.querySelectorAll('.file'), function (a) { a.classList.remove('on'); });
    var title = d || 'Package contents';
    view.innerHTML = '<div class="vhead"><div class="crumb"><a href="#d=">package</a>' + (d ? ' / ' + esc(d) : '') + '</div><h2>' + esc(title) + '</h2><p class="desc">' + files.length + ' files · ' +
      size(files.reduce(function (s, f) { return s + f.bytes; }, 0)) + '. Select a file to see it.</p></div><div class="vbody"><div class="tablewrap"><table class="data dirlist"><thead><tr><th>File</th><th>Description</th><th class="num">Size</th></tr></thead><tbody>' +
      files.map(function (f) { return '<tr><td><a href="#f=' + encodeURIComponent(f.path) + '">' + esc(d ? f.path.slice(d.length + 1) : f.path) + '</a></td><td>' + esc(f.desc) + '</td><td class="num">' + size(f.bytes) + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
    document.title = 'Paper I file browser';
  }
  function route() {
    var h = location.hash.replace(/^#/, ''), m;
    if ((m = h.match(/^f=(.*)$/)) && byPath[decodeURIComponent(m[1])]) return showFile(byPath[decodeURIComponent(m[1])]);
    if ((m = h.match(/^d=(.*)$/))) return showDir(decodeURIComponent(m[1]).replace(/\/$/, ''));
    if (h && (m = h.match(/^f=(.*)$/))) {
      var d = decodeURIComponent(m[1]).replace(/\/$/, '');
      if (M.files.some(function (f) { return f.path.indexOf(d + '/') === 0; })) return showDir(d);
    }
    showFile(byPath['README.md']);
  }
  window.addEventListener('hashchange', route);
  fetch('preview/manifest.json').then(function (r) { return r.json(); }).then(function (m) {
    M = m; M.files.forEach(function (f) { byPath[f.path] = f; });
    buildTree(); route();
  }).catch(function () { view.innerHTML = '<div class="vbody">The file list could not be loaded.</div>'; });
})();
</script>
</body>
</html>
